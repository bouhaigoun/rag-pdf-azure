# docker-compose.yml — Architecture DEV ISOPROD
# Flask API + n8n + init automatique credentials et workflow
# Le client fait uniquement : git clone + cp .env.example .env + docker-compose up -d

services:
  flask-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - rag-network

  n8n:
    image: n8nio/n8n:stable
    ports:
      - "5678:5678"
    environment:
      # Injecte les variables depuis .env
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - N8N_API_KEY=${N8N_API_KEY}
      # Active l'API n8n pour le script init
      - N8N_PUBLIC_API_DISABLED=false
    volumes:
      # Persiste credentials et workflows entre redémarrages
      - n8n_data:/home/node/.n8n
      # Monte le workflow pour que init.sh puisse l'importer
      - ./workflow_n8n.json:/app/workflow_n8n.json
    networks:
      - rag-network

  n8n-init:
    image: curlimages/curl:latest
    depends_on:
      - n8n
    env_file:
      - .env
    volumes:
      # Monte le script init et le workflow nettoyé
      - ./scripts/init.sh:/init.sh
      - ./workflow_import.json:/app/workflow_import.json
    # Exécute le script une seule fois au démarrage
    command: sh /init.sh
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  n8n_data: