services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - rag-network

  flask-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  n8n_data:
